<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phúc Đẹp Trai - Dịch Vụ Cho Mượn Zalo Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .avatar-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
        }

        .avatar-glow {
            position: absolute;
            inset: -4px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            border-radius: 50%;
            filter: blur(12px);
            opacity: 0.8;
            animation: pulse 4s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .avatar {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .verified-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #38bdf8;
            color: #0f172a;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2.5px solid #0f172a;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
        }

        .btn-rent {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-rent:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(2, 132, 199, 0.6);
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-close:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .pricing-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .price-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .price-card:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.06);
        }

        .price-card.selected {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .price-card.featured.selected {
            border-color: #818cf8;
            background: rgba(99, 102, 241, 0.18);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .tag-hot {
            position: absolute;
            top: -10px;
            right: 18px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }

        .plan-name {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 2px;
        }

        .plan-desc {
            font-size: 12px;
            color: #64748b;
        }

        .plan-price {
            font-size: 18px;
            font-weight: 800;
            color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 20px -4px rgba(34, 197, 94, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #16a34a, #15803d);
        }

        .status-msg {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .status-msg.success {
            color: #4ade80;
            display: block;
        }

        .status-msg.error {
            color: #f87171;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-card">
            <div class="avatar-wrapper">
                <div class="avatar-glow"></div>
                <div class="avatar">P</div>
                <div class="verified-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
            </div>

            <h1>Phúc Đẹp Trai</h1>
            <p class="subtitle">Dịch vụ mượn Acc Zalo Uy Tín & Siêu Tốc</p>

            <div class="status-tag">
                <span class="status-dot"></span>
                Đang hoạt động • Sẵn sàng phục vụ
            </div>

            <button class="btn-rent" onclick="openModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Mượn Acc Zalo
            </button>
        </div>
    </div>

    <!-- Modal Chọn Gói & Xác Nhận Formspree -->
    <div class="modal-overlay" id="packageModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title">Xác Nhận Đăng Ký Mượn Acc</div>
                <button class="btn-close" onclick="closeModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <form id="rentForm" action="https://formspree.io/f/xyegqgpz" method="POST">
                <input type="hidden" name="Goi_Dang_Ky" id="selectedPlanInput" value="Gói Ngày - 3k/ngày">

                <div class="pricing-grid">
                    <!-- Gói Ngày -->
                    <div class="price-card selected" onclick="selectPlan('Gói Ngày - 3k/ngày', this)">
                        <div>
                            <div class="plan-name">Gói Ngày</div>
                            <div class="plan-desc">Thuê nhanh trải nghiệm 24h</div>
                        </div>
                        <div class="plan-price">3k<span style="font-size: 12px; color: #64748b;">/ngày</span></div>
                    </div>

                    <!-- Gói Tuần -->
                    <div class="price-card" onclick="selectPlan('Gói Tuần - 20k/tuần', this)">
                        <div>
                            <div class="plan-name">Gói Tuần</div>
                            <div class="plan-desc">Sử dụng thoải mái 7 ngày</div>
                        </div>
                        <div class="plan-price">20k<span style="font-size: 12px; color: #64748b;">/tuần</span></div>
                    </div>

                    <!-- Gói Tháng -->
                    <div class="price-card featured" onclick="selectPlan('Gói Tháng - 80k/tháng', this)">
                        <span class="tag-hot">KHUYÊN DÙNG</span>
                        <div>
                            <div class="plan-name">Gói Tháng</div>
                            <div class="plan-desc">Trọn gói 30 ngày ưu đãi nhất</div>
                        </div>
                        <div class="plan-price">80k<span style="font-size: 12px; color: #64748b;">/tháng</span></div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Xác Nhận Gửi Yêu Cầu</button>
                <div id="statusMsg" class="status-msg"></div>
            </form>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('packageModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('packageModal').classList.remove('active');
        }

        function selectPlan(planDetails, element) {
            document.getElementById('selectedPlanInput').value = planDetails;

            let cards = document.querySelectorAll('.price-card');
            cards.forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
        }

        document.getElementById('packageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        const form = document.getElementById("rentForm");
        const statusMsg = document.getElementById("statusMsg");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            const data = new FormData(event.target);
            submitBtn.innerText = "Đang gửi...";
            submitBtn.disabled = true;

            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    statusMsg.className = "status-msg success";
                    statusMsg.innerHTML = "✅ Gửi yêu cầu thành công! Phúc Đẹp Trai sẽ xử lý ngay.";
                    setTimeout(() => {
                        closeModal();
                        statusMsg.style.display = "none";
                        submitBtn.innerText = "Xác Nhận Gửi Yêu Cầu";
                        submitBtn.disabled = false;
                    }, 2500);
                } else {
                    statusMsg.className = "status-msg error";
                    statusMsg.innerHTML = "❌ Có lỗi xảy ra, vui lòng thử lại!";
                    submitBtn.innerText = "Xác Nhận Gửi Yêu Cầu";
                    submitBtn.disabled = false;
                }
            }).catch(error => {
                statusMsg.className = "status-msg error";
                statusMsg.innerHTML = "❌ Lỗi kết nối! Vui lòng kiểm tra lại.";
                submitBtn.innerText = "Xác Nhận Gửi Yêu Cầu";
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
  </html>
